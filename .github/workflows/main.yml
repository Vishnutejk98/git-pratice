```yaml
name: Build Spec Phase Practice

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build:
    name: Test Build Phases
    runs-on: ubuntu-latest

    steps:
      # INSTALL PHASE
      - name: INSTALL
        run: |
          echo "================================"
          echo "INSTALL PHASE STARTED"
          echo "================================"
          echo "Installing dependencies..."
          sudo apt-get update
          python --version
          git --version
          echo "INSTALL PHASE COMPLETED"

      # PRE_BUILD PHASE
      - name: PRE_BUILD
        run: |
          echo "================================"
          echo "PRE_BUILD PHASE STARTED"
          echo "================================"
          echo "Checking environment..."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_HEAD_REF"
          echo "Target branch: $GITHUB_BASE_REF"
          echo "PRE_BUILD PHASE COMPLETED"

      # BUILD PHASE
      - name: BUILD
        run: |
          echo "================================"
          echo "BUILD PHASE STARTED"
          echo "================================"
          echo "Running sample build commands..."
          mkdir -p build
          echo "Build successful" > build/result.txt
          cat build/result.txt
          echo "BUILD PHASE COMPLETED"

      # POST_BUILD PHASE
      - name: POST_BUILD
        if: always()
        run: |
          echo "================================"
          echo "POST_BUILD PHASE STARTED"
          echo "================================"
          echo "Build workflow finished."
          echo "Job status: ${{ job.status }}"
          echo "POST_BUILD PHASE COMPLETED"
```
